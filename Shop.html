<html>
    <head>
        <title>OnlyStrikes — Ball Shop</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="shop.css">
    </head>
    <body>

    <header class="nav">
        <div class="nav__inner">
            <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/" class="nav__brand" aria-label="OnlyStrikes home">
                <img class="nav__logo-icon" src="BrandLogo.png" alt="OnlyStrikes logo">
            </a>
            <nav class="nav__links" aria-label="Primary">
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/">Home</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Shop">Shop</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/ShareYourExp">Share</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Booking">Bookings</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Membership">Membership</a>
            </nav>
            <div class="nav__actions">
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/UserLogin" class="nav__profile" aria-label="Log in or sign up">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M4.5 19.5c1.6-3.6 4.6-5.4 7.5-5.4s5.9 1.8 7.5 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <span>Log in / Sign up</span>
                </a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Cart" class="nav__cart" aria-label="View cart">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20.5 8H6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="10" cy="20" r="1.4" fill="currentColor"/>
                        <circle cx="17" cy="20" r="1.4" fill="currentColor"/>
                    </svg>
                    <span class="nav__cart-count" data-cart-count="0">0</span>
                </a>
            </div>
            <button class="nav__burger" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="page-content shop-page">

        <section class="shop-hero">
            <div class="shop-hero__lanes" aria-hidden="true"></div>
            <p class="shop-hero__eyebrow">The Pro Shop</p>
            <h1 class="shop-hero__title">Balls built for <em>your</em> hook</h1>
            <p class="shop-hero__subtitle">From gentle house arcs to lane-eating hooks — pick a coverstock, dial in the weight, and add it to your bag.</p>
        </section>

        <div class="shop-filter-bar" role="group" aria-label="Filter by coverstock">
            <button class="shop-filter" type="button" data-filter="all" aria-pressed="true">All balls</button>
            <button class="shop-filter" type="button" data-filter="reactive">Reactive resin</button>
            <button class="shop-filter" type="button" data-filter="pearl">Pearl reactive</button>
            <button class="shop-filter" type="button" data-filter="urethane">Urethane</button>
            <button class="shop-filter" type="button" data-filter="plastic">Plastic / spare</button>
        </div>

        <ul class="shop-grid" id="shopGrid" aria-label="Bowling balls"></ul>

    </main>

    <div class="shop-toast" id="shopToast" role="status" aria-live="polite"></div>

    <footer class="footer">
        <div class="footer__inner">
            <a href="#" class="nav__brand nav__brand--footer">
                <svg class="nav__logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="32" cy="32" r="30" fill="#12213A"/>
                    <circle cx="22" cy="20" r="2.6" fill="#0A1526"/>
                    <circle cx="32" cy="16" r="2.6" fill="#0A1526"/>
                    <circle cx="22" cy="30" r="2.6" fill="#0A1526"/>
                    <rect x="23" y="30" width="18" height="15" rx="3" fill="#4FB6F0"/>
                    <path d="M26 30v-5a6 6 0 0 1 12 0v5" stroke="#4FB6F0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                    <circle cx="32" cy="36" r="2.6" fill="#0A1526"/>
                    <rect x="30.6" y="36" width="2.8" height="5.5" rx="1.2" fill="#0A1526"/>
                </svg>
                <span class="nav__brand-text">Only<em>Strikes</em></span>
            </a>
            <p class="footer__copy">&copy; 2026 OnlyStrikes. All pins reserved.</p>
        </div>
    </footer>

    <script>
        const nav = document.querySelector('.nav');
        let lastScrollY = window.scrollY;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;

            if (currentScrollY > lastScrollY && currentScrollY > 80) {
                nav.classList.add('nav--hidden');
            } else {
                nav.classList.remove('nav--hidden');
            }

            lastScrollY = currentScrollY;
        });

        // --- Shared cart (same localStorage contract as the Cart page) ---
        const CART_KEY = 'onlystrikes_cart';

        function getCart() {
            try {
                return JSON.parse(localStorage.getItem(CART_KEY)) || [];
            } catch {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function updateCartBadge() {
            const cart = getCart();
            const badge = document.querySelector('[data-cart-count]');
            if (badge) {
                const count = cart.reduce((sum, item) => sum + item.qty, 0);
                badge.textContent = count;
                badge.setAttribute('data-cart-count', count);
            }
        }

        function ballIcon(accent) {
            const svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" fill="${accent}"/>
                <circle cx="50" cy="50" r="46" fill="url(#g)" opacity="0.5"/>
                <defs>
                    <radialGradient id="g" cx="35%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
                        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>
                </defs>
                <circle cx="40" cy="34" r="4.5" fill="#0A1526"/>
                <circle cx="55" cy="30" r="4.5" fill="#0A1526"/>
                <circle cx="46" cy="46" r="4.5" fill="#0A1526"/>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        // --- Catalog ---
        const PRODUCTS = [
            { id: 'vortex-fang', name: 'Vortex Fang', coverstock: 'Reactive resin', filterKey: 'reactive', tag: 'Best seller', desc: 'Aggressive, angular back-end for medium-to-heavy oil.', hook: 92, price: 219, accent: '#4FB6F0' },
            { id: 'night-ember', name: 'Night Ember', coverstock: 'Pearl reactive', filterKey: 'pearl', desc: 'Quicker mid-lane revs with a clean snap into the pocket.', hook: 74, price: 189, accent: '#E0A868' },
            { id: 'chalk-comet', name: 'Chalk Comet', coverstock: 'Urethane', filterKey: 'urethane', desc: 'Smooth, controllable arc for dry lanes.', hook: 55, price: 159, accent: '#D6533F' },
            { id: 'iron-talon', name: 'Iron Talon', coverstock: 'Plastic / spare', filterKey: 'plastic', desc: 'Dead-straight and dependable for picking up spares.', hook: 12, price: 89, accent: '#8FA4C4' },
            { id: 'gutter-ghost', name: 'Gutter Ghost', coverstock: 'Reactive resin', filterKey: 'reactive', tag: 'Beginner pick', desc: 'Forgiving entry-level reactive with real hook.', hook: 48, price: 139, accent: '#7FD8C4' },
            { id: 'solid-slate', name: 'Solid Slate', coverstock: 'Pearl reactive', filterKey: 'pearl', desc: 'Do-it-all house ball that reads the mid-lane cleanly.', hook: 66, price: 179, accent: '#B98FE0' },
            { id: 'crimson-fury', name: 'Crimson Fury', coverstock: 'Reactive resin', filterKey: 'reactive', desc: 'Sharp, explosive motion off a strong midlane read.', hook: 88, price: 209, accent: '#E0574A' },
            { id: 'blue-serpent', name: 'Blue Serpent', coverstock: 'Pearl reactive', filterKey: 'pearl', desc: 'Skids longer then snaps hard into the pocket.', hook: 70, price: 195, accent: '#3E7FD6' },
            { id: 'amber-drift', name: 'Amber Drift', coverstock: 'Urethane', filterKey: 'urethane', desc: 'Predictable, low-flare roll for spare shooting on hook.', hook: 60, price: 165, accent: '#D69A3E' },
            { id: 'oak-strike', name: 'Oak Strike', coverstock: 'Plastic / spare', filterKey: 'plastic', desc: 'A house-shot classic — light oil, straight and true.', hook: 15, price: 85, accent: '#C98A4E' },
            { id: 'storm-rattler', name: 'Storm Rattler', coverstock: 'Reactive resin', filterKey: 'reactive', tag: 'Pro series', desc: 'Max flare for heavy oil and high-rev players.', hook: 95, price: 229, accent: '#2E4F8C' },
            { id: 'frost-fang', name: 'Frost Fang', coverstock: 'Pearl reactive', filterKey: 'pearl', desc: 'Bright pearl finish with a crisp, angular finish.', hook: 78, price: 199, accent: '#7FC4E0' },
            { id: 'copper-coil', name: 'Copper Coil', coverstock: 'Urethane', filterKey: 'urethane', desc: 'Warm, controllable shape ideal for medium oil.', hook: 52, price: 155, accent: '#B5651D' },
            { id: 'steel-pin', name: 'Steel Pin', coverstock: 'Plastic / spare', filterKey: 'plastic', desc: 'Budget-friendly straight roller, built to last.', hook: 10, price: 79, accent: '#9CA8B8' },
            { id: 'midnight-hook', name: 'Midnight Hook', coverstock: 'Reactive resin', filterKey: 'reactive', desc: 'Deep, dark pop off the breakpoint for heavy oil.', hook: 90, price: 215, accent: '#1B2E4D' },
            { id: 'golden-arc', name: 'Golden Arc', coverstock: 'Pearl reactive', filterKey: 'pearl', desc: 'Long, easy arc with a controlled, readable finish.', hook: 72, price: 185, accent: '#E0B84F' }
        ];

        const shopGrid = document.getElementById('shopGrid');

        function renderGrid(filter) {
            const items = filter === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.filterKey === filter);

            shopGrid.innerHTML = items.map(p => `
                <li class="shop-card" data-id="${p.id}">
                    <div class="shop-card__image-wrap">
                        ${p.tag ? `<span class="shop-card__tag">${p.tag}</span>` : ''}
                        <img class="shop-card__image" src="${ballIcon(p.accent)}" alt="${p.name} bowling ball">
                    </div>
                    <p class="shop-card__coverstock">${p.coverstock}</p>
                    <h3 class="shop-card__name">${p.name}</h3>
                    <p class="shop-card__desc">${p.desc}</p>

                    <div class="shop-card__hook">
                        <div class="shop-card__hook-label">
                            <span>Hook potential</span>
                            <span>${p.hook}/100</span>
                        </div>
                        <div class="shop-card__hook-track">
                            <div class="shop-card__hook-fill" style="width:${p.hook}%"></div>
                        </div>
                    </div>

                    <div class="shop-card__options">
                        <div class="shop-card__field">
                            <label for="weight-${p.id}">Weight</label>
                            <select id="weight-${p.id}" class="shop-weight-select">
                                ${[16,15,14,13,12,11,10,9,8,7,6].map(w => `<option value="${w}" ${w === 15 ? 'selected' : ''}>${w} lb</option>`).join('')}
                            </select>
                        </div>
                        <div class="shop-card__field">
                            <label>Qty</label>
                            <div class="shop-card__qty">
                                <button class="shop-qty-btn" type="button" data-action="decrease" aria-label="Decrease quantity">-</button>
                                <span class="shop-qty-value">1</span>
                                <button class="shop-qty-btn" type="button" data-action="increase" aria-label="Increase quantity">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="shop-card__footer">
                        <span class="shop-card__price">$${p.price.toFixed(2)}</span>
                        <button class="shop-add-btn" type="button" data-action="add">Add to cart</button>
                    </div>
                </li>
            `).join('');
        }

        renderGrid('all');
        updateCartBadge();

        document.querySelector('.shop-filter-bar').addEventListener('click', (e) => {
            const btn = e.target.closest('.shop-filter');
            if (!btn) return;
            document.querySelectorAll('.shop-filter').forEach(b => b.setAttribute('aria-pressed', 'false'));
            btn.setAttribute('aria-pressed', 'true');
            renderGrid(btn.dataset.filter);
        });

        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('shopToast');
            toast.textContent = message;
            toast.classList.add('shop-toast--visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('shop-toast--visible'), 1400);
        }

        shopGrid.addEventListener('click', (e) => {
            const card = e.target.closest('.shop-card');
            if (!card) return;
            const qtyValue = card.querySelector('.shop-qty-value');

            if (e.target.closest('[data-action="increase"]')) {
                qtyValue.textContent = Math.min(4, Number(qtyValue.textContent) + 1);
                return;
            }
            if (e.target.closest('[data-action="decrease"]')) {
                qtyValue.textContent = Math.max(1, Number(qtyValue.textContent) - 1);
                return;
            }

            if (e.target.closest('[data-action="add"]')) {
                const addBtn = e.target.closest('[data-action="add"]');
                const product = PRODUCTS.find(p => p.id === card.dataset.id);
                const weight = card.querySelector('.shop-weight-select').value;
                const qty = Number(qtyValue.textContent);
                const variantId = `${product.id}-${weight}lb`;

                const cart = getCart();
                const existing = cart.find(item => item.id === variantId);
                if (existing) {
                    existing.qty += qty;
                } else {
                    cart.push({
                        id: variantId,
                        name: `${product.name} — ${weight}lb`,
                        price: product.price,
                        qty: qty,
                        image: ballIcon(product.accent),
                        type: 'product'
                    });
                }
                saveCart(cart);
                updateCartBadge();
                showToast(`${product.name} (${weight}lb) added to cart`);

                // Quick visual confirmation on the button itself — no page navigation
                const originalLabel = addBtn.textContent;
                addBtn.textContent = 'Added ✓';
                addBtn.classList.add('shop-add-btn--done');
                setTimeout(() => {
                    addBtn.textContent = originalLabel;
                    addBtn.classList.remove('shop-add-btn--done');
                }, 900);
            }
        });
    </script>
    </body>
</html>
