
<html>
    <head>
        <title>OnlyStrikes — Cart</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="cart.css">
    </head>
    <body>

    <header class="nav">
        <div class="nav__inner">
            <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/" class="nav__brand" aria-label="OnlyStrikes home">
                <img class="nav__logo-icon" src="BrandLogo.png" alt="OnlyStrikes logo">
            </a>
            <nav class="nav__links" aria-label="Primary">
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/">Home</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Shop">Shop</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/ShareYourExp">Share</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Booking">Bookings</a>
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Membership">Membership</a>
            </nav>
            <div class="nav__actions">
                <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/UserLogin" class="nav__profile" aria-label="Log in or sign up">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M4.5 19.5c1.6-3.6 4.6-5.4 7.5-5.4s5.9 1.8 7.5 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <span>Log in / Sign up</span>
                </a>
            </div>
            <button class="nav__burger" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="page-content cart-page">
        <div class="cart-page__inner">
            <h1 class="cart-page__title">Your Cart</h1>

            <div id="cartEmptyState" class="cart-empty">
                <p>Your cart is empty. Head to the <a href="https://howtotrainyourdragon2.github.io/OnlyStrike/Shop">Shop</a> to add some gear.</p>
            </div>

            <ul id="cartItemsList" class="cart-items" hidden></ul>

            <div id="cartSummary" class="cart-summary" hidden>
                <div class="cart-summary__row">
                    <span>Subtotal</span>
                    <span id="cartSubtotal">$0.00</span>
                </div>
                <div class="cart-summary__row cart-summary__row--total">
                    <span>Total</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="cart-checkout-btn" id="checkoutBtn">Checkout</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <a href="#" class="nav__brand nav__brand--footer">
                <svg class="nav__logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="32" cy="32" r="30" fill="#12213A"/>
                    <circle cx="22" cy="20" r="2.6" fill="#0A1526"/>
                    <circle cx="32" cy="16" r="2.6" fill="#0A1526"/>
                    <circle cx="22" cy="30" r="2.6" fill="#0A1526"/>
                    <rect x="23" y="30" width="18" height="15" rx="3" fill="#4FB6F0"/>
                    <path d="M26 30v-5a6 6 0 0 1 12 0v5" stroke="#4FB6F0" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                    <circle cx="32" cy="36" r="2.6" fill="#0A1526"/>
                    <rect x="30.6" y="36" width="2.8" height="5.5" rx="1.2" fill="#0A1526"/>
                </svg>
                <span class="nav__brand-text">Only<em>Strikes</em></span>
            </a>
            <p class="footer__copy">&copy; 2026 OnlyStrikes. All pins reserved.</p>
        </div>
    </footer>

    <script>
        const nav = document.querySelector('.nav');
        let lastScrollY = window.scrollY;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;

            if (currentScrollY > lastScrollY && currentScrollY > 80) {
            nav.classList.add('nav--hidden');
            } else {
            nav.classList.remove('nav--hidden');
            }

            lastScrollY = currentScrollY;
        });

        // --- Cart logic (localStorage-based; expects items added elsewhere as [{id,name,price,qty,image}]) ---
        const CART_KEY = 'onlystrikes_cart';

        function getCart() {
            try {
                return JSON.parse(localStorage.getItem(CART_KEY)) || [];
            } catch {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function formatPrice(n) {
            return '$' + n.toFixed(2);
        }

        function updateCartBadge(cart) {
            const badge = document.querySelector('[data-cart-count]');
            if (badge) {
                const count = cart.reduce((sum, item) => sum + item.qty, 0);
                badge.textContent = count;
                badge.setAttribute('data-cart-count', count);
            }
        }

        // Known detail keys -> display label. Add new keys here as new cart-item
        // types (bookings, memberships, future product options, etc.) are introduced.
        const DETAIL_LABELS = {
            bookingType: 'Package',
            date: 'Date',
            time: 'Time',
            lanes: 'Lanes',
            players: 'Players',
            duration: 'Duration',
            rateTag: 'Rate',
            plan: 'Plan',
            billing: 'Billing',
            perks: 'Perks'
        };

        function formatDetailValue(key, value) {
            if (key === 'date') {
                return new Date(value + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
            }
            if (key === 'duration') {
                return value + 'h';
            }
            return value;
        }

        function buildMetaList(details) {
            if (!details) return '';
            const rows = Object.entries(details)
                .filter(([key, value]) => value !== null && value !== undefined && DETAIL_LABELS[key])
                .map(([key, value]) => `<li><strong>${DETAIL_LABELS[key]}:</strong> ${formatDetailValue(key, value)}</li>`)
                .join('');
            return rows ? `<ul class="cart-item__meta">${rows}</ul>` : '';
        }

        function renderCart() {
            const cart = getCart();
            const emptyState = document.getElementById('cartEmptyState');
            const list = document.getElementById('cartItemsList');
            const summary = document.getElementById('cartSummary');

            updateCartBadge(cart);

            if (cart.length === 0) {
                emptyState.hidden = false;
                list.hidden = true;
                summary.hidden = true;
                return;
            }

            emptyState.hidden = true;
            list.hidden = false;
            summary.hidden = false;

            list.innerHTML = cart.map((item, index) => {
                // 'booking' and 'membership' items represent a fixed-quantity purchase
                // (a lane slot, a plan) rather than a stackable product, so their qty is locked.
                const isFixedQty = item.type === 'booking' || item.type === 'membership';
                const typeClass = item.type ? `cart-item--${item.type}` : '';

                const metaList = buildMetaList(item.details);

                const qtyControl = isFixedQty
                    ? `<div class="cart-item__qty cart-item__qty--fixed"><span>Qty ${item.qty}</span></div>`
                    : `<div class="cart-item__qty">
                            <button class="cart-qty-btn" data-action="decrease" aria-label="Decrease quantity">-</button>
                            <span>${item.qty}</span>
                            <button class="cart-qty-btn" data-action="increase" aria-label="Increase quantity">+</button>
                       </div>`;

                return `
                    <li class="cart-item ${typeClass}" data-index="${index}">
                        <img class="cart-item__image" src="${item.image || 'BrandLogo.png'}" alt="${item.name}">
                        <div class="cart-item__details">
                            <p class="cart-item__name">${item.name}</p>
                            <p class="cart-item__price">${formatPrice(item.price)}</p>
                            ${metaList}
                        </div>
                        ${qtyControl}
                        <p class="cart-item__line-total">${formatPrice(item.price * item.qty)}</p>
                        <button class="cart-item__remove" data-action="remove" aria-label="Remove item">&times;</button>
                    </li>
                `;
            }).join('');

            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            document.getElementById('cartSubtotal').textContent = formatPrice(subtotal);
            document.getElementById('cartTotal').textContent = formatPrice(subtotal);
        }

        document.getElementById('cartItemsList').addEventListener('click', (e) => {
            const button = e.target.closest('button');
            if (!button) return;

            const li = e.target.closest('.cart-item');
            const index = Number(li.dataset.index);
            const cart = getCart();
            const action = button.dataset.action;

            if (action === 'increase') {
                cart[index].qty += 1;
            } else if (action === 'decrease') {
                cart[index].qty = Math.max(1, cart[index].qty - 1);
            } else if (action === 'remove') {
                cart.splice(index, 1);
            }

            saveCart(cart);
            renderCart();
        });

        document.getElementById('checkoutBtn')?.addEventListener('click', () => {
            window.location.href = 'https://howtotrainyourdragon2.github.io/OnlyStrike/Booking';
        });

        renderCart();
    </script>
    </body>
</html>
